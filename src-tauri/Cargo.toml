[package]
name = "esptool-gui"
version = "0.1.0"
description = "A beautiful GUI for esptool"
authors = ["you"]
edition = "2021"

[lib]
name = "esptool_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "esptool-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["shell-open"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
serialport = "4"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
